; P4Display_node — two Guition ESP32-P4 + C6 touch displays running the same
; T89 dashboard:
;   * JC4880P443C_I_W_Y   4.3" 480x800 ST7701S MIPI-DSI  — the TEST RIG display
;   * JC1060P470C-I-W-Y   7"   1024x600 JD9165 MIPI-DSI  — the CAR display
;
; Envs:
;   t89_ui         4.3" dashboard (SquareLine screens, DSEG fonts, GaugeUpdater)
;                  with a stubbed, animated CAN snapshot. Renders a logical
;                  800x480 landscape frame that the PPA rotates onto the
;                  portrait glass.
;   t89_ui_1060    the same dashboard on the 7" board, scaled 1.25x
;                  (src/t89_ui_1060/ui_scale.h). That glass is natively
;                  landscape, so there is no rotation anywhere in the path.
;                  ⚠️ NEVER RUN ON HARDWARE — written from vendor docs while the
;                  board was still in the post. See lib/guition-jc1060p470-bsp/
;                  VENDORED.md for what is sourced and what is guessed.
;   c6_wifi        C6 co-processor diagnostic: reports hosted slave version,
;                  updates it from an embedded image if mismatched, then runs
;                  a PitServer-style SoftAP test. Per-UNIT, not per-model: each
;                  physical board has its own C6 shipped with factory firmware,
;                  so a new board needs this run once before WiFi/pit mode works.
;   c6_wifi_1060   the same tool built for the 7" board (see the note above it)
;
; Phase-1/2 bring-up envs (colorbar_test, lvgl_test, lvgl9_test) were removed
; once t89_ui superseded them — see git history if the raw framebuffer /
; PPA-rotate demo scaffolding is ever needed again.
;
; Gotchas inherited from the 4.3" BSP:
;   * board jc4880p4.json carries chip_variant esp32p4_es — verified booting on
;     this unit's rev v1.3 silicon; without it the 2nd-stage bootloader hits
;     "Illegal instruction". jc1060p4.json inherits that field UNVERIFIED.
;   * platform pinned to pioarduino 55.03.36-1: 55.03.35/37 bootloop the P4.
;   * no esp_lcd_st7701 / esp_lcd_jd9165 vendor driver — the BSPs' manual
;     bring-up is the point (vendor driver leaves the 4.3" panel black).
;   * only the boards' High-Speed USB-C port enumerates (/dev/ttyACM0).

[platformio]
; Both board definitions live here, NOT in the BSP libs. Each BSP still ships
; its own copy under lib/*/boards as the upstream reference, but PlatformIO
; reads only this directory — edit the files here.
boards_dir = boards
default_envs = t89_ui

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36-1/platform-espressif32.zip
framework = arduino

board_build.f_cpu = 360000000L
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv

monitor_speed = 115200

; Only board-independent flags belong here — the panel/touch pins differ
; between the two displays and are set per-env below.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_ESP_LCD_TOUCH_MAX_POINTS=5
    ; DSI PHY internal LDO — same channel and voltage on both boards
    -DBOARD_P4_DSI_LDO_CHAN=3
    -DBOARD_P4_DSI_LDO_MV=2500

; The two c6_wifi envs build the SAME src/c6_wifi sources — that tool touches no
; board pins at all (the SDIO mapping comes from the Arduino core's hosted stack
; for esp32p4, not from the BSPs), so the only thing that differs is which board
; definition it is built against. They exist separately so that if jc1060p4.json
; ever diverges from jc4880p4.json — dropping chip_variant is the likely one —
; the C6 tool for the 7" board picks that up instead of silently booting the
; wrong variant.
[env:c6_wifi]
board = jc4880p4
build_src_filter = +<c6_wifi/>
board_build.embed_files = src/c6_wifi/c6fw.bin

[env:c6_wifi_1060]
board = jc1060p4
build_src_filter = +<c6_wifi/>
board_build.embed_files = src/c6_wifi/c6fw.bin

[env:t89_ui]
board = jc4880p4
build_src_filter = +<t89_ui/>
lib_deps = lvgl@~9.5.0
build_flags =
    ${env.build_flags}
    '-DLV_CONF_PATH="${PROJECT_DIR}/lv_conf_v9.h"'
    ; panel + touch pins (HW-verified by the BSP; override if schematic differs)
    -DBOARD_P4_LCD_RST=5
    -DBOARD_P4_LCD_BL=23
    -DBOARD_P4_TOUCH_SDA=7
    -DBOARD_P4_TOUCH_SCL=8
    -DBOARD_P4_TOUCH_RST=3
    -DBOARD_P4_TOUCH_INT=-1
    ; the SquareLine tree includes "ui.h" etc. relative to the env root.
    ; MUST be a relative path, not ${PROJECT_DIR} — on this toolchain the
    ; absolute form resolves into pioarduino's path-shortening "builder"
    ; staging copy of the project instead of the real source tree, and that
    ; staging mirror doesn't reliably include this dir, causing sporadic
    ; "ui.h: No such file or directory" on some SquareLine component files.
    -Isrc/t89_ui

[env:t89_ui_1060]
board = jc1060p4
; The 17 MB of image .c under src/t89_ui/images is SHARED, not copied: the
; artwork is identical, ui_scale.h just draws it at 1.25x. Those files include
; "../ui.h", so they pull in the 4.3" tree's declarations — harmless, they only
; need lv_image_dsc_t, and nothing links across the two screen sets. The fonts
; are NOT shared: src/t89_ui_1060/fonts holds 1.25x recuts under the same symbol
; names (see the README there).
build_src_filter = +<t89_ui_1060/> +<t89_ui/images/>
lib_deps = lvgl@~9.5.0
build_flags =
    ${env.build_flags}
    '-DLV_CONF_PATH="${PROJECT_DIR}/lv_conf_v9.h"'
    ; panel + touch pins from the vendor's Arduino demo for this model.
    ; ⚠️ UNVERIFIED. Differences from the 4.3" board: LCD reset 5 -> 27,
    ; touch reset 3 -> 22, touch INT is a real pin (21) instead of polling.
    -DBOARD_P4_LCD_RST=27
    -DBOARD_P4_LCD_BL=23
    -DBOARD_P4_TOUCH_SDA=7
    -DBOARD_P4_TOUCH_SCL=8
    -DBOARD_P4_TOUCH_RST=22
    -DBOARD_P4_TOUCH_INT=21
    ; same relative-path requirement as t89_ui above
    -Isrc/t89_ui_1060
