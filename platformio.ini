; P4Display_node — phased bring-up for the Guition JC4880P443C_I_W_Y
; (ESP32-P4 + C6, 4.3" 480x800 ST7701S MIPI-DSI, GT911 touch).
;
; Envs:
;   colorbar_test  phase 1 — raw framebuffer color bars + touch echo (no LVGL)
;   lvgl_test      phase 2 — LVGL 8.3 demo UI via PPA hardware-rotate glue
;   lvgl9_test     phase 2 — same demo on LVGL 9.5 with the T89 project's
;                  lv_conf (lv_conf_v9.h) — the config the real UI ports onto
;   t89_ui         phase 3 — the real T89 dashboard (SquareLine screens, DSEG
;                  fonts, GaugeUpdater) with a stubbed, animated CAN snapshot
;   c6_wifi        phase 4 — C6 co-processor diagnostic: reports hosted slave
;                  version, updates it from an embedded image if mismatched,
;                  then runs a PitServer-style SoftAP test
;
; Based on guition-jc4880p4-bsp examples. Gotchas inherited from the BSP:
;   * board jc4880p4.json carries chip_variant esp32p4_es — verified booting on
;     this unit's rev v1.3 silicon; without it the 2nd-stage bootloader hits
;     "Illegal instruction".
;   * platform pinned to pioarduino 55.03.36-1: 55.03.35/37 bootloop the P4.
;   * no esp_lcd_st7701 vendor driver — the BSP's manual bring-up is the point
;     (vendor driver leaves this panel black).
;   * only the board's High-Speed USB-C port enumerates (/dev/ttyACM0).

[platformio]
boards_dir = lib/guition-jc4880p4-bsp/boards
default_envs = t89_ui

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36-1/platform-espressif32.zip
board = jc4880p4
framework = arduino

board_build.f_cpu = 360000000L
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv

monitor_speed = 115200

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_ESP_LCD_TOUCH_MAX_POINTS=5
    ; panel + touch pins (HW-verified by the BSP; override if schematic differs)
    -DBOARD_P4_LCD_RST=5
    -DBOARD_P4_LCD_BL=23
    -DBOARD_P4_TOUCH_SDA=7
    -DBOARD_P4_TOUCH_SCL=8
    -DBOARD_P4_TOUCH_RST=3
    -DBOARD_P4_TOUCH_INT=-1
    ; DSI PHY internal LDO
    -DBOARD_P4_DSI_LDO_CHAN=3
    -DBOARD_P4_DSI_LDO_MV=2500

[env:colorbar_test]
build_src_filter = +<colorbar/>

[env:lvgl_test]
build_src_filter = +<lvgl_demo/>
lib_deps = lvgl@~8.3.0
build_flags =
    ${env.build_flags}
    -DLV_CONF_PATH="${PROJECT_DIR}/lv_conf.h"

[env:lvgl9_test]
build_src_filter = +<lvgl9_demo/>
lib_deps = lvgl@~9.5.0
build_flags =
    ${env.build_flags}
    ; LVGL 9 does `#include LV_CONF_PATH` verbatim — quotes must be IN the macro
    '-DLV_CONF_PATH="${PROJECT_DIR}/lv_conf_v9.h"'

[env:c6_wifi]
build_src_filter = +<c6_wifi/>
board_build.embed_files = src/c6_wifi/c6fw.bin

[env:t89_ui]
build_src_filter = +<t89_ui/>
lib_deps = lvgl@~9.5.0
build_flags =
    ${env.build_flags}
    '-DLV_CONF_PATH="${PROJECT_DIR}/lv_conf_v9.h"'
    ; the SquareLine tree includes "ui.h" etc. relative to the env root
    -I ${PROJECT_DIR}/src/t89_ui
